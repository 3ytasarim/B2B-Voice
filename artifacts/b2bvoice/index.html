  <body style="overflow-x:hidden;max-width:100vw;">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TWK7KMW9"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root" style="overflow-x:hidden;max-width:100vw;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- ElevenLabs ConvAI Widget — home page only (it looked out of place on
         inner pages like /demo, which already has its own CTA). -->
    <style>
      /* The floating widget (and especially its opened chat panel) was
         claiming most of the viewport on phones — shrink it on small
         screens. Use `zoom`, not `transform: scale()`: the widget positions
         itself with `position: fixed` internally, and a CSS transform on an
         ancestor changes the containing block fixed-position descendants
         resolve against (breaks/mispositions it, worse on WebKit/Safari —
         real iPhones — than in Chromium dev tools). `zoom` rescales layout
         itself instead of post-layout painting, so fixed positioning still
         resolves against the real viewport. */
      @media (max-width: 640px) {
        elevenlabs-convai {
          zoom: 0.62;
        }
      }
    </style>

    <!-- Third-party scripts are scheduled so they never compete with the first
         render (on a throttled phone ~1 MB of GTM + Meta pixel + widget + session
         recorder was queued ahead of the hero image and fonts):
           - voice widget (home only): right after the page has loaded, when idle
           - Google Tag Manager (and the GA4/Meta tags inside it): on the visitor's
             first interaction, or 4 s after load at the latest
           - Umami session recorder: first interaction, or 10 s after load -->
    <script>
      (function () {
        var done = {};
        function addScript(src, attrs) {
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          for (var k in attrs) s.setAttribute(k, attrs[k]);
          document.body.appendChild(s);
        }
        function once(name, fn) {
          if (done[name]) return;
          done[name] = true;
          fn();
        }
        function loadGtm() {
          once("gtm", function () {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            addScript("https://www.googletagmanager.com/gtm.js?id=GTM-TWK7KMW9");
          });
        }
        function loadRecorder() {
          once("recorder", function () {
            addScript("https://analytics.bleibsichtbar.com/recorder.js", {
              "data-website-id": "03a6ce51-8cd8-400c-9d7c-97d776810b3a",
            });
          });
        }
        function loadWidget() {
          if (location.pathname !== "/") return;
          once("widget", function () {
            var widget = document.createElement("elevenlabs-convai");
            widget.setAttribute("agent-id", "agent_5701m2wppr84fw4r1fzrs191yghh");
            widget.setAttribute("disable-banner", "true");
            document.body.appendChild(widget);
            addScript("https://unpkg.com/@elevenlabs/convai-widget-embed");
          });
        }
        var events = ["pointerdown", "keydown", "touchstart", "scroll", "mousemove"];
        function onInteract() {
          events.forEach(function (e) { removeEventListener(e, onInteract); });
          loadGtm();
          loadRecorder();
        }
        events.forEach(function (e) { addEventListener(e, onInteract, { passive: true }); });
        addEventListener("load", function () {
          if ("requestIdleCallback" in window) requestIdleCallback(loadWidget, { timeout: 4000 });
          else setTimeout(loadWidget, 2000);
          setTimeout(loadGtm, 4000);
          setTimeout(loadRecorder, 10000);
        });
      })();
    </script>
    <!-- End ElevenLabs ConvAI Widget -->


  </body>
