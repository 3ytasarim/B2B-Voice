# Production vhosts for b2b-voice.com. Certificate/SSL lines are the ones
# certbot already created; only the routing changed.

# https://b2b-voice.com (canonical)
server {
    server_name b2b-voice.com;

    root /var/www/b2b-voice/artifacts/b2bvoice/dist/public;
    index index.html;
    client_max_body_size 20M;

    include snippets/b2b-voice-locations.conf;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/b2b-voice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/b2b-voice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# https://www.b2b-voice.com -> https://b2b-voice.com (single 301)
server {
    server_name www.b2b-voice.com;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/b2b-voice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b2b-voice.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://b2b-voice.com$request_uri;
}

# http://(www.)b2b-voice.com -> https://b2b-voice.com (single 301, no www hop)
server {
    listen 80;
    listen [::]:80;
    server_name b2b-voice.com www.b2b-voice.com;

    return 301 https://b2b-voice.com$request_uri;
}
