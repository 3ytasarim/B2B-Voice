# Local-only staging: reachable ONLY from the server itself (127.0.0.1:8081),
# so nothing is exposed publicly. Test with curl / verify.sh on the server.
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /var/www/b2b-voice-staging/artifacts/b2bvoice/dist/public;
    index index.html;
    client_max_body_size 20M;

    include snippets/b2b-voice-locations.conf;
}
