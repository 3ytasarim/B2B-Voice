# Shared by the production and staging server blocks
# (install as /etc/nginx/snippets/b2b-voice-locations.conf).
#
# The site is prerendered: /blog is dist/public/blog.html, /what-is-b2b-voice
# is dist/public/what-is-b2b-voice.html, "/" is index.html. Unknown URLs are
# a real 404 (dist/public/404.html).

error_page 404 /404.html;
location = /404.html { internal; }

# --- compression (Brotli: see the note at the bottom) -----------------------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/xml application/rss+xml
           application/javascript text/javascript application/json image/svg+xml;

# --- API -> Express ---------------------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:5010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# --- content-hashed build output: cache for a year ---------------------------
location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# --- home: "/" is index.html; /index.html itself is a duplicate -> 301 -------
location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location = /index.html { return 301 /; }

# --- admin: client-side SPA shells, never indexed ---------------------------
location = /admin {
    try_files /admin.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /admin/login {
    try_files /admin/login.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# --- /page.html is a duplicate of /page -> 301 --------------------------------
location ~ ^/(.+)\.html$ { return 301 /$1; }

# --- everything else: /blog -> blog.html, files as-is, otherwise a real 404 --
location / {
    rewrite ^/(.+)/$ /$1 permanent;          # one canonical form: no trailing slash
    try_files $uri $uri.html =404;
    add_header Cache-Control "no-cache";     # HTML/XML/TXT revalidate; assets are hashed
}

# Brotli (optional): needs `sudo apt install libnginx-mod-http-brotli-filter
# libnginx-mod-http-brotli-static`, then uncomment:
#   brotli on;
#   brotli_comp_level 5;
#   brotli_types text/plain text/css text/xml application/xml application/rss+xml
#                application/javascript text/javascript application/json image/svg+xml;
